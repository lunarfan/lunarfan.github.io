# Tsuki-278 — known-vulnerable dependencies, on a schedule. A red run is GitHub's
# email to the repo owner; what to do then: lunarfan-specs/spec/Ops/dependency-security.md.
# Weekly until 2026-11-25, then monthly (the spec says when to change the cron).
name: security-scan

on:
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # Production dependencies only: dev tools never ship. Reads the lock; no install.
      - name: npm audit (high and above)
        run: npm audit --omit=dev --audit-level=high
      # Trivy by digest, not through a third-party action (a tag can be moved under you).
      - name: trivy (lockfiles, HIGH/CRITICAL)
        if: always()
        run: >
          docker run --rm -v "$PWD":/src
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
